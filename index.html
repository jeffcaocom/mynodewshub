<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNAKE.EXE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            background: #0a0a0f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #00ff88;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px),
                linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: -1;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.1),
                rgba(0,0,0,0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 0;
        }

        .game-container {
            text-align: center;
            background: rgba(10, 10, 15, 0.95);
            border: 2px solid #00ff88;
            padding: 30px;
            box-shadow: 
                0 0 20px rgba(0, 255, 136, 0.3),
                inset 0 0 30px rgba(0, 255, 136, 0.05);
            position: relative;
            z-index: 1;
        }

        .game-container::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border: 1px solid rgba(0, 255, 136, 0.3);
            pointer-events: none;
        }

        .game-container::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            width: 10px;
            height: 10px;
            border-left: 2px solid #00ff88;
            border-top: 2px solid #00ff88;
        }

        h1 {
            margin-bottom: 25px;
            text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88, 0 0 30px #00ff88;
            letter-spacing: 5px;
            font-size: 2.5rem;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-size: 1.2rem;
            gap: 20px;
        }

        .score-board span {
            background: rgba(0, 255, 136, 0.05);
            padding: 10px 25px;
            border: 1px solid #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }

        .score-board strong {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }

        #gameCanvas {
            background: #050508;
            border: 2px solid #00ff88;
            box-shadow: 
                0 0 30px rgba(0, 255, 136, 0.2),
                inset 0 0 50px rgba(0, 0, 0, 0.8);
        }

        .controls {
            margin-top: 20px;
        }

        button {
            background: transparent;
            color: #00ff88;
            border: 2px solid #00ff88;
            padding: 12px 35px;
            font-size: 1.1rem;
            font-family: 'Share Tech Mono', monospace;
            cursor: pointer;
            transition: all 0.2s;
            margin: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        button:hover {
            background: rgba(0, 255, 136, 0.1);
            box-shadow: 
                0 0 20px rgba(0, 255, 136, 0.5),
                inset 0 0 20px rgba(0, 255, 136, 0.1);
        }

        .instructions {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #666;
            border-top: 1px solid #00ff88;
            padding-top: 15px;
        }

        .instructions p {
            margin: 5px 0;
        }

        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 15, 0.98);
            border: 2px solid #ff0055;
            padding: 50px;
            text-align: center;
            z-index: 1000;
            display: none;
            box-shadow: 
                0 0 50px rgba(255, 0, 85, 0.5),
                inset 0 0 30px rgba(255, 0, 85, 0.1);
        }

        .game-over h2 {
            color: #ff0055;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #ff0055, 0 0 40px #ff0055;
            letter-spacing: 3px;
        }

        .game-over p {
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: #fff;
        }

        .game-over span {
            color: #00ffff;
            text-shadow: 0 0 15px #00ffff;
        }

        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 50%,
                rgba(0, 255, 136, 0.02) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>
    <div class="scanline"></div>
    
    <div class="game-container">
        <h1>&lt;SNAKE.EXE&gt;</h1>
        
        <div class="score-board">
            <span>[SCORE: <strong id="score">000</strong>]</span>
            <span>[BEST: <strong id="highScore">000</strong>]</span>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div class="controls">
            <button id="startBtn">&gt; INITIALIZE</button>
            <button id="pauseBtn">&gt; PAUSE</button>
        </div>

        <div class="instructions">
            <p>&gt; CONTROLS: ARROW KEYS / WASD</p>
            <p>&gt; SPACE: PAUSE / RESUME</p>
            <p>&gt; CONSUME DATA PACKETS TO GROW</p>
        </div>
    </div>

    <div class="game-over" id="gameOver">
        <h2>&lt;SYSTEM FAILURE&gt;</h2>
        <p>FINAL SCORE: <span id="finalScore">000</span></p>
        <button onclick="restartGame()">&gt; REBOOT SYSTEM</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const gameOverElement = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [];
        let food = {};
        let direction = { x: 0, y: 0 };
        let nextDirection = { x: 0, y: 0 };
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameLoop = null;
        let gameSpeed = 100;
        let isGameRunning = false;
        let isPaused = false;

        highScoreElement.textContent = String(highScore).padStart(3, '0');

        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            gameSpeed = 100;
            scoreElement.textContent = '000';
            gameOverElement.style.display = 'none';
            placeFood();
        }

        function placeFood() {
            do {
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
        }

        function drawGrid() {
            ctx.strokeStyle = 'rgba(0, 255, 136, 0.1)';
            ctx.lineWidth = 1;
            
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }
        }

        function draw() {
            ctx.fillStyle = '#050508';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            drawGrid();
            drawFood();
            drawSnake();
        }

        function drawFood() {
            const x = food.x * gridSize;
            const y = food.y * gridSize;
            
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff0055';
            ctx.fillStyle = '#ff0055';
            ctx.fillRect(x + 4, y + 4, gridSize - 8, gridSize - 8);
            
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff0055';
            ctx.strokeStyle = '#ff0055';
            ctx.lineWidth = 2;
            ctx.strokeRect(x + 2, y + 2, gridSize - 4, gridSize - 4);
            
            ctx.shadowBlur = 0;
        }

        function drawSnake() {
            snake.forEach((segment, index) => {
                const x = segment.x * gridSize;
                const y = segment.y * gridSize;
                
                if (index === 0) {
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#00ff88';
                    ctx.fillStyle = '#00ff88';
                    ctx.fillRect(x + 2, y + 2, gridSize - 4, gridSize - 4);
                    
                    ctx.fillStyle = '#00ffff';
                    ctx.fillRect(x + 6, y + 6, 4, 4);
                    ctx.fillRect(x + 10, y + 6, 4, 4);
                } else {
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#00ff88';
                    ctx.fillStyle = '#00ff88';
                    ctx.fillRect(x + 3, y + 3, gridSize - 6, gridSize - 6);
                    
                    ctx.strokeStyle = '#00ff88';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x + 4, y + 4, gridSize - 8, gridSize - 8);
                }
                
                ctx.shadowBlur = 0;
            });
        }

        function update() {
            direction = { ...nextDirection };

            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            if (checkCollision(head)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = String(score).padStart(3, '0');
                
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.textContent = String(highScore).padStart(3, '0');
                    localStorage.setItem('snakeHighScore', highScore);
                }
                
                placeFood();
                
                if (gameSpeed > 50) {
                    gameSpeed -= 2;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(gameStep, gameSpeed);
                }
            } else {
                snake.pop();
            }
        }

        function checkCollision(head) {
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return true;
            }
            
            return snake.some(segment => segment.x === head.x && segment.y === head.y);
        }

        function gameOver() {
            clearInterval(gameLoop);
            isGameRunning = false;
            finalScoreElement.textContent = String(score).padStart(3, '0');
            gameOverElement.style.display = 'block';
            startBtn.textContent = '&gt; INITIALIZE';
            pauseBtn.textContent = '&gt; PAUSE';
        }

        function gameStep() {
            if (!isPaused) {
                update();
                draw();
            }
        }

        function startGame() {
            if (!isGameRunning) {
                initGame();
                isGameRunning = true;
                isPaused = false;
                startBtn.textContent = '&gt; RESTART';
                pauseBtn.textContent = '&gt; PAUSE';
                draw();
                gameLoop = setInterval(gameStep, gameSpeed);
            } else {
                restartGame();
            }
        }

        function restartGame() {
            clearInterval(gameLoop);
            startGame();
        }

        function togglePause() {
            if (isGameRunning) {
                isPaused = !isPaused;
                pauseBtn.textContent = isPaused ? '&gt; RESUME' : '&gt; PAUSE';
            }
        }

        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
                    break;
                case ' ':
                    if (isGameRunning) togglePause();
                    break;
            }
        });

        startBtn.addEventListener('click', startGame);
        pauseBtn.addEventListener('click', togglePause);

        initGame();
        draw();
    </script>
</body>
</html>
