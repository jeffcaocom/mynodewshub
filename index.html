<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多功能工具</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/fold/foldcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/fold/foldgutter.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/fold/brace-fold.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/fold/foldgutter.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            overflow: hidden;
            color: #e0e0e0;
        }
        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .tabs {
            display: flex;
            background: linear-gradient(90deg, #1a1a2e 0%, #0f0f23 100%);
            border-bottom: 2px solid #00d4ff;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3);
            flex-shrink: 0;
        }
        .tab {
            padding: 18px 35px;
            cursor: pointer;
            background: transparent;
            border: none;
            font-size: 16px;
            font-weight: 600;
            color: #6b7280;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
        }
        .tab:hover {
            color: #00d4ff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }
        .tab.active {
            color: #00d4ff;
            background: linear-gradient(180deg, rgba(0, 212, 255, 0.1) 0%, transparent 100%);
        }
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.8);
        }
        .tab-content {
            display: none;
            flex: 1;
            padding: 20px;
            overflow: auto;
        }
        .tab-content.active {
            display: flex;
            flex-direction: column;
        }
        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-right: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        .btn:hover::before {
            left: 100%;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: #0a0a0a;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4);
        }
        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.6);
            transform: translateY(-2px);
        }
        .btn-success {
            background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
            color: #0a0a0a;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.4);
        }
        .btn-success:hover {
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.6);
            transform: translateY(-2px);
        }
        .btn-warning {
            background: linear-gradient(135deg, #ffaa00 0%, #ff8800 100%);
            color: #0a0a0a;
            box-shadow: 0 4px 15px rgba(255, 170, 0, 0.4);
        }
        .btn-warning:hover {
            box-shadow: 0 6px 20px rgba(255, 170, 0, 0.6);
            transform: translateY(-2px);
        }
        .json-editor {
            display: flex;
            gap: 15px;
            flex: 1;
            min-height: 0;
        }
        .json-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(26, 26, 46, 0.6);
            border-radius: 12px;
            border: 1px solid rgba(0, 212, 255, 0.2);
            padding: 15px;
            backdrop-filter: blur(10px);
        }
        .json-panel h3 {
            margin-bottom: 12px;
            color: #00d4ff;
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }
        .json-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        .json-status {
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 13px;
            margin-top: 10px;
            font-weight: 500;
        }
        .json-status.valid {
            color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
        }
        .json-status.invalid {
            color: #ff4757;
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.3);
        }
        .CodeMirror {
            height: 100%;
            font-size: 14px;
            border-radius: 8px;
            background: rgba(10, 10, 20, 0.8) !important;
        }
        .js-editor {
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex: 1;
            min-height: 0;
        }
        .js-panel {
            flex: 1;
            background: rgba(26, 26, 46, 0.6);
            border-radius: 12px;
            border: 1px solid rgba(0, 212, 255, 0.2);
            padding: 15px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
        }
        .js-panel h3 {
            color: #00d4ff;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }
        .js-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        #jsInput, #jsOutput {
            flex: 1;
            width: 100%;
            background: rgba(10, 10, 20, 0.8);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 8px;
            color: #e0e0e0;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            padding: 15px;
            resize: none;
            outline: none;
        }
        #jsInput:focus, #jsOutput:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }
        #jsOutput {
            background: rgba(10, 10, 20, 0.6);
        }
        .calendar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
        }
        .calendar-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            align-items: center;
            background: rgba(26, 26, 46, 0.6);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid rgba(0, 212, 255, 0.2);
            backdrop-filter: blur(10px);
        }
        select {
            padding: 10px 20px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            background: rgba(10, 10, 20, 0.8);
            color: #e0e0e0;
            cursor: pointer;
            transition: all 0.3s;
            outline: none;
        }
        select:hover, select:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }
        select option {
            background: #1a1a2e;
            color: #e0e0e0;
        }
        .calendar {
            background: rgba(26, 26, 46, 0.6);
            border-radius: 12px;
            border: 1px solid rgba(0, 212, 255, 0.2);
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        .calendar-header {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: #0a0a0a;
            font-size: 24px;
            font-weight: 700;
            border-radius: 8px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: rgba(0, 212, 255, 0.1);
            border-radius: 8px 8px 0 0;
        }
        .calendar-weekdays div {
            padding: 12px;
            text-align: center;
            font-weight: 700;
            color: #00d4ff;
            font-size: 14px;
            text-transform: uppercase;
        }
        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }
        .calendar-day {
            padding: 18px 12px;
            text-align: center;
            border: 1px solid rgba(0, 212, 255, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 15px;
        }
        .calendar-day:hover {
            background: rgba(0, 212, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
            transform: scale(1.1);
        }
        .calendar-day.today {
            background: linear-gradient(135deg, #00d4ff 0%, #00ff88 100%);
            color: #0a0a0a;
            font-weight: 700;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
            transform: scale(1.1);
        }
        .calendar-day.other-month {
            color: #4b5563;
        }
        h2 {
            color: #00d4ff;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
        }
        @media (max-width: 768px) {
            .json-editor {
                flex-direction: column;
            }
            .tab {
                padding: 12px 20px;
                font-size: 14px;
            }
            .calendar-weekdays div, .calendar-day {
                padding: 10px 8px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tabs">
            <button class="tab active" onclick="switchTab('json')">JSON编辑器</button>
            <button class="tab" onclick="switchTab('js')">JS混淆压缩</button>
            <button class="tab" onclick="switchTab('calendar')">万年历</button>
        </div>

        <div id="json" class="tab-content active">
            <h2>JSON编辑器</h2>
            <div class="json-editor">
                <div class="json-panel">
                    <h3>编辑</h3>
                    <div class="json-buttons">
                        <button class="btn btn-primary" onclick="formatJSON()">格式化</button>
                        <button class="btn btn-success" onclick="minifyJSON()">压缩</button>
                    </div>
                    <textarea id="jsonInput"></textarea>
                    <div id="jsonStatus" class="json-status"></div>
                </div>
                <div class="json-panel">
                    <h3>预览</h3>
                    <textarea id="jsonOutput"></textarea>
                </div>
            </div>
        </div>

        <div id="js" class="tab-content">
            <h2>JavaScript代码混淆和压缩</h2>
            <div class="js-editor">
                <div class="js-panel">
                    <h3>输入代码</h3>
                    <textarea id="jsInput" placeholder="输入JavaScript代码"></textarea>
                </div>
                <div class="js-buttons">
                    <button class="btn btn-primary" onclick="minifyJS()">压缩</button>
                    <button class="btn btn-warning" onclick="obfuscateJS()">混淆</button>
                    <button class="btn btn-success" onclick="clearJS()">清空</button>
                </div>
                <div class="js-panel">
                    <h3>结果</h3>
                    <textarea id="jsOutput" placeholder="结果将显示在这里" readonly></textarea>
                </div>
            </div>
        </div>

        <div id="calendar" class="tab-content">
            <h2>万年历</h2>
            <div class="calendar-container">
                <div class="calendar-controls">
                    <select id="yearSelect"></select>
                    <select id="monthSelect">
                        <option value="0">1月</option>
                        <option value="1">2月</option>
                        <option value="2">3月</option>
                        <option value="3">4月</option>
                        <option value="4">5月</option>
                        <option value="5">6月</option>
                        <option value="6">7月</option>
                        <option value="7">8月</option>
                        <option value="8">9月</option>
                        <option value="9">10月</option>
                        <option value="10">11月</option>
                        <option value="11">12月</option>
                    </select>
                    <button class="btn btn-primary" onclick="goToToday()">今天</button>
                </div>
                <div class="calendar">
                    <div class="calendar-header" id="calendarTitle"></div>
                    <div class="calendar-weekdays">
                        <div>日</div>
                        <div>一</div>
                        <div>二</div>
                        <div>三</div>
                        <div>四</div>
                        <div>五</div>
                        <div>六</div>
                    </div>
                    <div class="calendar-days" id="calendarDays"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let editorInput, editorOutput;

        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.querySelector(`[onclick="switchTab('${tabId}')"]`).classList.add('active');
            document.getElementById(tabId).classList.add('active');
            setTimeout(() => {
                if (editorInput) editorInput.refresh();
                if (editorOutput) editorOutput.refresh();
            }, 10);
        }

        function initCodeMirror() {
            editorInput = CodeMirror.fromTextArea(document.getElementById('jsonInput'), {
                mode: { name: 'javascript', json: true },
                theme: 'dracula',
                lineNumbers: true,
                foldGutter: true,
                gutters: ['CodeMirror-linenumbers', 'CodeMirror-foldgutter'],
                autoCloseBrackets: true,
                matchBrackets: true,
                indentUnit: 4,
                tabSize: 4
            });

            editorOutput = CodeMirror.fromTextArea(document.getElementById('jsonOutput'), {
                mode: { name: 'javascript', json: true },
                theme: 'dracula',
                lineNumbers: true,
                foldGutter: true,
                gutters: ['CodeMirror-linenumbers', 'CodeMirror-foldgutter'],
                readOnly: true,
                indentUnit: 4,
                tabSize: 4
            });

            editorInput.on('change', validateJSON);
        }

        function validateJSON() {
            const value = editorInput.getValue();
            const statusDiv = document.getElementById('jsonStatus');
            
            if (value.trim() === '') {
                statusDiv.className = 'json-status';
                statusDiv.textContent = '';
                return;
            }

            try {
                JSON.parse(value);
                statusDiv.className = 'json-status valid';
                statusDiv.textContent = '✓ JSON格式正确';
            } catch (e) {
                statusDiv.className = 'json-status invalid';
                statusDiv.textContent = '✗ JSON格式错误: ' + e.message;
            }
        }

        function formatJSON() {
            const value = editorInput.getValue();
            try {
                const obj = JSON.parse(value);
                editorInput.setValue(JSON.stringify(obj, null, 4));
                editorOutput.setValue(JSON.stringify(obj, null, 4));
                validateJSON();
            } catch (e) {
                alert('JSON格式错误: ' + e.message);
            }
        }

        function minifyJSON() {
            const value = editorInput.getValue();
            try {
                const obj = JSON.parse(value);
                const minified = JSON.stringify(obj);
                editorInput.setValue(minified);
                editorOutput.setValue(minified);
                validateJSON();
            } catch (e) {
                alert('JSON格式错误: ' + e.message);
            }
        }

        function minifyJS() {
            const input = document.getElementById('jsInput').value;
            let output = input
                .replace(/\/\/.*$/gm, '')
                .replace(/\/\*[\s\S]*?\*\//g, '')
                .replace(/\s+/g, ' ')
                .replace(/\s*([{}();,:<>=+\-*\/])\s*/g, '$1')
                .trim();
            document.getElementById('jsOutput').value = output;
        }

        function obfuscateJS() {
            const input = document.getElementById('jsInput').value;
            const variables = [];
            const varPattern = /var\s+([a-zA-Z_$][a-zA-Z0-9_$]*)/g;
            let match;
            while ((match = varPattern.exec(input)) !== null) {
                if (!variables.includes(match[1])) {
                    variables.push(match[1]);
                }
            }
            let output = input;
            const obfuscatedNames = [];
            const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ_$';
            for (let i = 0; i < variables.length; i++) {
                let name = '';
                let n = i;
                do {
                    name = chars[n % chars.length] + name;
                    n = Math.floor(n / chars.length);
                } while (n > 0);
                obfuscatedNames.push(name);
            }
            variables.forEach((oldName, index) => {
                const newName = obfuscatedNames[index];
                const regex = new RegExp('\\b' + oldName + '\\b', 'g');
                output = output.replace(regex, newName);
            });
            output = output
                .replace(/\/\/.*$/gm, '')
                .replace(/\/\*[\s\S]*?\*\//g, '')
                .replace(/\s+/g, ' ')
                .replace(/\s*([{}();,:<>=+\-*\/])\s*/g, '$1')
                .trim();
            document.getElementById('jsOutput').value = output;
        }

        function clearJS() {
            document.getElementById('jsInput').value = '';
            document.getElementById('jsOutput').value = '';
        }

        function initCalendar() {
            const yearSelect = document.getElementById('yearSelect');
            const currentYear = new Date().getFullYear();
            for (let i = currentYear - 100; i <= currentYear + 100; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = i + '年';
                if (i === currentYear) option.selected = true;
                yearSelect.appendChild(option);
            }
            document.getElementById('monthSelect').value = new Date().getMonth();
            renderCalendar();
            yearSelect.addEventListener('change', renderCalendar);
            document.getElementById('monthSelect').addEventListener('change', renderCalendar);
        }

        function renderCalendar() {
            const year = parseInt(document.getElementById('yearSelect').value);
            const month = parseInt(document.getElementById('monthSelect').value);
            const today = new Date();
            
            document.getElementById('calendarTitle').textContent = year + '年' + (month + 1) + '月';
            
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDay = firstDay.getDay();
            const totalDays = lastDay.getDate();
            
            const prevMonth = new Date(year, month, 0);
            const prevMonthDays = prevMonth.getDate();
            
            const calendarDays = document.getElementById('calendarDays');
            calendarDays.innerHTML = '';
            
            for (let i = startDay - 1; i >= 0; i--) {
                const day = document.createElement('div');
                day.className = 'calendar-day other-month';
                day.textContent = prevMonthDays - i;
                calendarDays.appendChild(day);
            }
            
            for (let i = 1; i <= totalDays; i++) {
                const day = document.createElement('div');
                day.className = 'calendar-day';
                day.textContent = i;
                if (today.getFullYear() === year && today.getMonth() === month && today.getDate() === i) {
                    day.classList.add('today');
                }
                calendarDays.appendChild(day);
            }
            
            const remainingDays = 42 - (startDay + totalDays);
            for (let i = 1; i <= remainingDays; i++) {
                const day = document.createElement('div');
                day.className = 'calendar-day other-month';
                day.textContent = i;
                calendarDays.appendChild(day);
            }
        }

        function goToToday() {
            const today = new Date();
            document.getElementById('yearSelect').value = today.getFullYear();
            document.getElementById('monthSelect').value = today.getMonth();
            renderCalendar();
        }

        window.onload = function() {
            initCodeMirror();
            initCalendar();
        };

        window.onresize = function() {
            if (editorInput) editorInput.refresh();
            if (editorOutput) editorOutput.refresh();
        };
    </script>
</body>
</html>
